[project]
name = "peek"
version = "0.1.0"
description = "A light, mouse-first code editor for the terminal"
requires-python = ">=3.13"
dependencies = [
  "textual[syntax]>=8.2.8",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
v = "peek.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
